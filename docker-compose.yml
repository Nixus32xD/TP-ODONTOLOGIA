# Entorno local del sistema odontológico (stack de la cátedra).
# Los puertos se publican sólo en 127.0.0.1. Datos exclusivamente ficticios.
# Uso: copiar .env.example como .env, completar contraseñas locales y ejecutar `docker compose up --build`.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odontologia
      POSTGRES_USER: odontologia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontologia -d odontologia"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ODONTOLOGIA_DB: /data/agenda-c01.sqlite3
      DATABASE_URL: postgresql+psycopg://odontologia:${POSTGRES_PASSWORD}@db:5432/odontologia
      REDIS_URL: redis://redis:6379/0
      JWT_SECRETO: ${JWT_SECRETO:?Definir JWT_SECRETO en .env}
    volumes:
      - agenda-c01:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  agenda-c01:
